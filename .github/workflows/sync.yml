name: Scraper Sync
on:
  schedule:
    - cron: '40 5,9,13,16,21 * * *'
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Wybierz tryb działania scrapera'
        required: true
        default: 'full'
        type: choice
        options:
          - full
          - catalog_only

concurrency:
  group: scraper-sync
  cancel-in-progress: false

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONUNBUFFERED: "1"
      SCRAPER_ONLY: ${{ github.event.inputs.run_mode || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r scraper/requirements.txt
      - name: Run Scraper
        run: python -m scraper.main
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SCRAPER_ONLY: ${{ env.SCRAPER_ONLY }}
